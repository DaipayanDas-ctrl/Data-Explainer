version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
  network:
    port: "8000"
  env:
    - name: LLM_PROVIDER
      value: groq
    - name: GROQ_MODEL
      value: llama-3.3-70b-versatile
  health-check:
    protocol: HTTP
    path: /api/health
    interval: 10
    timeout: 5
    healthy-threshold: 1
    unhealthy-threshold: 5
